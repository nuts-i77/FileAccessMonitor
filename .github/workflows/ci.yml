name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build FileAccessMonitor.csproj -c Release

      - name: Test
        run: dotnet test tests/FileAccessMonitor.Tests -c Release --logger "console;verbosity=normal"

      - name: Test Linux agent
        run: dotnet test linux-agent/tests -c Release

      - name: Publish Linux agent (self-contained, linux-x64)
        run: dotnet publish linux-agent/FileAccessMonitor.Agent.Linux.csproj -c Release -r linux-x64 --self-contained true -o ${{ runner.temp }}/linux-agent /p:PublishSingleFile=true /p:EnableCompressionInSingleFile=true /p:DebugType=None

      - name: Publish Linux monitoring server (self-contained, linux-x64)
        run: dotnet publish FileAccessMonitor.csproj -c Release -r linux-x64 --self-contained true -o ${{ runner.temp }}/linux-server /p:PublishSingleFile=true /p:EnableCompressionInSingleFile=true /p:DebugType=None /p:IsTransformWebConfigDisabled=true /p:InvariantGlobalization=true /p:PredefinedCulturesOnly=false

      - name: Publish (self-contained, win-x64)
        run: dotnet publish FileAccessMonitor.csproj -c Release -r win-x64 --self-contained true -o publish /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true /p:DebugType=None /p:IsTransformWebConfigDisabled=true
