name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build FileAccessMonitor.csproj -c Release

      - name: Test
        run: dotnet test tests/FileAccessMonitor.Tests -c Release --logger "console;verbosity=normal"

      - name: Publish (self-contained, win-x64)
        run: dotnet publish FileAccessMonitor.csproj -c Release -r win-x64 --self-contained true -o publish /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true
