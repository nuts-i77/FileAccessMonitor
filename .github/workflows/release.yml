name: Release

# Push a tag such as v1.0.0 to build the installer and publish a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write       # build provenance attestation
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: |
          dotnet test tests/FileAccessMonitor.Tests -c Release
          if ($LASTEXITCODE -ne 0) { exit 1 }
          dotnet test linux-agent/tests -c Release

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      # Code signing via SignPath Foundation. It runs only after the repository variable
      # SIGNPATH_ORGANIZATION_ID and the secret SIGNPATH_API_TOKEN are set; otherwise the
      # release is built unsigned. The app exe is signed before it goes into the installer,
      # then the installer itself is signed.
      - name: Build app
        shell: pwsh
        run: ./build.ps1 -Version ("${{ github.ref_name }}".TrimStart('v'))

      - name: Upload app exe for signing
        id: upload-exe
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exe
          path: publish/FileAccessMonitor.exe

      - name: Sign app exe
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'FileAccessMonitor' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: publish

      - name: Build installer
        shell: pwsh
        run: ./build-installer.ps1 -Version ("${{ github.ref_name }}".TrimStart('v')) -SkipBuild

      - name: Upload installer for signing
        id: upload-setup
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-setup
          path: dist/FileAccessMonitor-Setup-*.exe

      - name: Sign installer
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'FileAccessMonitor' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist

      - name: Package portable zip and checksums
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          Compress-Archive -Path publish, install-service.ps1, setup-audit.ps1, restore-audit.ps1, LICENSE, README.md, README.ja.md `
                           -DestinationPath "dist/FileAccessMonitor-$v-win-x64.zip"
          # Linux agent (Samba): one self-contained file, its systemd unit and installer
          $agent = "FileAccessMonitor-$v-linux-x64-agent"
          dotnet publish linux-agent/FileAccessMonitor.Agent.Linux.csproj -c Release -r linux-x64 --self-contained true `
            -o "linux-dist/$agent" /p:PublishSingleFile=true /p:EnableCompressionInSingleFile=true /p:DebugType=None /p:Version=$v
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item linux-agent/install.sh, linux-agent/fileaccessmonitor-agent.service, LICENSE, README.md, README.ja.md "linux-dist/$agent/"
          tar -czf "dist/$agent.tar.gz" -C linux-dist $agent
          # Linux monitoring server: the same app as on Windows, with its web GUI files, unit and installer.
          # Culture data is not needed (formatting is culture-invariant), so it runs without libicu.
          $server = "FileAccessMonitor-$v-linux-x64-server"
          dotnet publish FileAccessMonitor.csproj -c Release -r linux-x64 --self-contained true -o "linux-dist/$server" `
            /p:PublishSingleFile=true /p:EnableCompressionInSingleFile=true /p:DebugType=None /p:IsTransformWebConfigDisabled=true `
            /p:InvariantGlobalization=true /p:PredefinedCulturesOnly=false /p:Version=$v
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Remove-Item "linux-dist/$server/*.a"
          Copy-Item linux-server/install.sh, linux-server/fileaccessmonitor.service, LICENSE, README.md, README.ja.md "linux-dist/$server/"
          tar -czf "dist/$server.tar.gz" -C linux-dist $server
          Get-ChildItem dist -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt -Encoding ascii

      # Lets users check where a file was built: gh attestation verify <file> -R <owner>/<repo>
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      # Release notes come from docs/releases/<tag>.md when it exists, otherwise from the commits
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "docs/releases/${{ github.ref_name }}.md"
          if (Test-Path $notes) {
            gh release create "${{ github.ref_name }}" dist/* --title "${{ github.ref_name }}" --notes-file $notes
          } else {
            gh release create "${{ github.ref_name }}" dist/* --title "${{ github.ref_name }}" --generate-notes
          }
