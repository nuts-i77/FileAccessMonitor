name: Release

# Push a tag such as v1.0.0 to build the installer and publish a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write       # build provenance attestation
  attestations: write

jobs:
  # Linux agent and monitoring server: tar.gz (with install.sh), deb and rpm. Built on Linux so that
  # file modes and owners in the archives are right.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test Linux agent
        run: dotnet test linux-agent/tests -c Release

      - name: Install nfpm
        run: |
          curl -sSfL -o /tmp/nfpm.deb https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_amd64.deb
          echo "787af76e172dd5fc7cedf4d7c5a090a2f62be9001557a4db1103e270f90ddefd  /tmp/nfpm.deb" | sha256sum -c
          sudo dpkg -i /tmp/nfpm.deb

      - name: Build Linux packages
        run: |
          set -e
          v="${GITHUB_REF_NAME#v}"
          agent="FileAccessMonitor-$v-linux-x64-agent"
          server="FileAccessMonitor-$v-linux-x64-server"
          dotnet publish linux-agent/FileAccessMonitor.Agent.Linux.csproj -c Release -r linux-x64 --self-contained true \
            -o "build/agent" /p:PublishSingleFile=true /p:EnableCompressionInSingleFile=true /p:DebugType=None /p:Version=$v
          # Culture data is not needed (formatting is culture-invariant), so it runs without libicu
          dotnet publish FileAccessMonitor.csproj -c Release -r linux-x64 --self-contained true -o "build/server" \
            /p:PublishSingleFile=true /p:EnableCompressionInSingleFile=true /p:DebugType=None /p:IsTransformWebConfigDisabled=true \
            /p:InvariantGlobalization=true /p:PredefinedCulturesOnly=false /p:Version=$v
          rm -f build/server/*.a
          mkdir -p linux-dist "build/$agent" "build/$server"
          cp -a build/agent/. linux-agent/install.sh linux-agent/fileaccessmonitor-agent.service LICENSE README.md README.ja.md "build/$agent/"
          cp -a build/server/. linux-server/install.sh linux-server/fileaccessmonitor.service linux-server/fileaccessmonitor-server \
            LICENSE README.md README.ja.md "build/$server/"
          tar -czf "linux-dist/$agent.tar.gz" --owner=0 --group=0 -C build "$agent"
          tar -czf "linux-dist/$server.tar.gz" --owner=0 --group=0 -C build "$server"
          for format in deb rpm; do
            VERSION=$v nfpm package -f packaging/nfpm-agent.yaml -p $format -t linux-dist/
            VERSION=$v nfpm package -f packaging/nfpm-server.yaml -p $format -t linux-dist/
          done
          ls -l linux-dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: linux-dist/*

  release:
    needs: linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/FileAccessMonitor.Tests -c Release

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      # Code signing via SignPath Foundation. It runs only after the repository variable
      # SIGNPATH_ORGANIZATION_ID and the secret SIGNPATH_API_TOKEN are set; otherwise the
      # release is built unsigned. The app exe is signed before it goes into the installer,
      # then the installer itself is signed.
      - name: Build app
        shell: pwsh
        run: ./build.ps1 -Version ("${{ github.ref_name }}".TrimStart('v'))

      - name: Upload app exe for signing
        id: upload-exe
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exe
          path: publish/FileAccessMonitor.exe

      - name: Sign app exe
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'FileAccessMonitor' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: publish

      - name: Build installer
        shell: pwsh
        run: ./build-installer.ps1 -Version ("${{ github.ref_name }}".TrimStart('v')) -SkipBuild

      - name: Upload installer for signing
        id: upload-setup
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-setup
          path: dist/FileAccessMonitor-Setup-*.exe

      - name: Sign installer
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'FileAccessMonitor' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist

      # tar.gz, deb and rpm from the linux job
      - uses: actions/download-artifact@v4
        with:
          name: linux-dist
          path: dist

      - name: Package portable zip and checksums
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          Compress-Archive -Path publish, install-service.ps1, setup-audit.ps1, restore-audit.ps1, LICENSE, README.md, README.ja.md `
                           -DestinationPath "dist/FileAccessMonitor-$v-win-x64.zip"
          Get-ChildItem dist -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt -Encoding ascii

      # Lets users check where a file was built: gh attestation verify <file> -R <owner>/<repo>
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      # Release notes come from docs/releases/<tag>.md when it exists, otherwise from the commits
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "docs/releases/${{ github.ref_name }}.md"
          if (Test-Path $notes) {
            gh release create "${{ github.ref_name }}" dist/* --title "${{ github.ref_name }}" --notes-file $notes
          } else {
            gh release create "${{ github.ref_name }}" dist/* --title "${{ github.ref_name }}" --generate-notes
          }
